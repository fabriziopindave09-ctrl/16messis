<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16 meses juntos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,300;1,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff2f4;--glow:rgba(255,122,147,.30);--ink:#3a0f2c;--soft:#8b4a68;--accent:#d6285f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b0a19;--glow:rgba(255,122,147,.22);--ink:#ffe9ee;--soft:#e8a3b8;--accent:#ff7a93}
}
:root[data-theme="dark"]{--bg:#1b0a19;--glow:rgba(255,122,147,.22);--ink:#ffe9ee;--soft:#e8a3b8;--accent:#ff7a93}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 36%,var(--glow),transparent 72%);
}
main{position:relative;text-align:center;padding:24px 16px;width:100%;max-width:640px}
.lead{
  margin:0 0 .1em;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;
  font-size:clamp(22px,5.5vw,32px);color:var(--soft);
}
.big{
  margin:0;display:flex;align-items:baseline;justify-content:center;gap:.12em;
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;line-height:.9;
  color:var(--accent);text-shadow:0 0 .4em var(--glow);
  animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both;
}
.big #m{font-size:clamp(130px,40vw,270px)}
.big .u{font-size:clamp(30px,8.5vw,58px);font-weight:400;color:var(--ink);text-shadow:none}
.rest{
  list-style:none;margin:clamp(28px,6vh,48px) auto 0;padding:0;max-width:540px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,3vw,26px);
  animation:fade 1s .9s both;
}
.rest b{
  display:block;font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1;
  font-size:clamp(30px,8.5vw,50px);font-variant-numeric:tabular-nums lining-nums;
}
.rest span{display:block;margin-top:.45em;font-size:clamp(13px,3.3vw,16px);color:var(--soft)}
.beat b{display:inline-block;color:var(--accent);animation:beat 1s ease-in-out infinite}
.since{margin:clamp(28px,6vh,44px) 0 0;color:var(--soft);font-size:clamp(14px,3.6vw,17px);line-height:1.6;animation:fade 1s 1.2s both}
.sign{margin:.9em 0 0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:clamp(20px,5vw,26px);animation:fade 1s 1.5s both}
.hint{margin:2.2em 0 0;font-size:13px;color:var(--soft);opacity:.7;animation:fade 1s 2s both}
.pop{
  position:fixed;z-index:5;pointer-events:none;color:var(--accent);font-size:var(--sz,22px);
  transform:translate(-50%,-50%);animation:pop .95s ease-out forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes beat{0%,40%,100%{transform:scale(1)}12%{transform:scale(1.16)}26%{transform:scale(1.06)}}
@keyframes pop{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <p class="lead" id="lead">Llevamos juntos</p>
  <h1 class="big"><span id="m">16</span><span class="u" id="mu">meses</span></h1>
  <ul class="rest">
    <li><b id="d">0</b><span>días</span></li>
    <li><b id="h">00</b><span>horas</span></li>
    <li><b id="mi">00</b><span>minutos</span></li>
    <li class="beat"><b id="s">00</b><span>segundos</span></li>
  </ul>
  <p class="since">Desde el <span id="since"></span><br><span id="total"></span> días en total, y los que vienen.</p>
  <p class="sign">Gracias por cada uno.</p>
  <p class="hint">Tocá la pantalla.</p>
</main>
<script>
(function () {
  // Fecha de inicio: 10 de junio de 2025
  var START = new Date(2025, 5, 10, 0, 0, 0);
  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("since").textContent = START.getDate() + " de " + MESES[START.getMonth()] + " de " + START.getFullYear();

  function addMonths(d, n) { var r = new Date(d); r.setMonth(d.getMonth() + n); return r; }

  function tick() {
    var now = new Date();
    var months = (now.getFullYear() - START.getFullYear()) * 12 + now.getMonth() - START.getMonth();
    var anchor = addMonths(START, months);
    if (anchor > now) { months--; anchor = addMonths(START, months); }
    if (months < 0) { months = 0; anchor = START; }
    var ms = Math.max(0, now - anchor);
    var days = Math.floor(ms / 864e5); ms %= 864e5;
    var h = Math.floor(ms / 36e5); ms %= 36e5;
    var mi = Math.floor(ms / 6e4); ms %= 6e4;
    var s = Math.floor(ms / 1e3);

    $("m").textContent = months;
    $("mu").textContent = months === 1 ? "mes" : "meses";
    $("d").textContent = days;
    $("h").textContent = pad(h);
    $("mi").textContent = pad(mi);
    $("s").textContent = pad(s);
    $("total").textContent = Math.floor((now - START) / 864e5).toLocaleString("es-AR");
    $("lead").textContent = (days === 0 && months > 0) ? "Hoy cumplimos" : "Llevamos juntos";
  }
  tick();
  setInterval(tick, 1000);

  // Corazones al tocar la pantalla
  if (!reduce) {
    document.addEventListener("pointerdown", function (e) {
      for (var i = 0; i < 7; i++) {
        var el = document.createElement("span");
        el.className = "pop";
        el.textContent = "♥";
        var a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
        el.style.left = e.clientX + "px";
        el.style.top = e.clientY + "px";
        el.style.setProperty("--dx", Math.cos(a) * dist + "px");
        el.style.setProperty("--dy", Math.sin(a) * dist - 30 + "px");
        el.style.setProperty("--r", (Math.random() * 60 - 30) + "deg");
        el.style.setProperty("--sz", (16 + Math.random() * 18) + "px");
        el.addEventListener("animationend", function () { this.remove(); });
        document.body.appendChild(el);
      }
    });
  }
})();
</script>
</body>
</html>
